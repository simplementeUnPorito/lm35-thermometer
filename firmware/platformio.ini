; Compilar:  pio run -d firmware      Subir:  pio run -d firmware -t upload --upload-port COMx
; ESP32-WROOM-32U DevKit usa el mismo SoC/placa "esp32dev" (la 32U solo cambia a antena externa u.FL).
[platformio]
src_dir = lm35_stream

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0
